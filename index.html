
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing App</title>
    <link rel="stylesheet" href="draw.css">

</head>
<body>
    <header>
        <h1>Create</h1>
        <p>Draw something!</p>
    </header>

    <main class="layout">
        <section class="tools">
             <div class="music-player">
            <h3>MUSIC PLAYER</h3>
            <p id="songName">Song1</p>
            <div class="music-controls">
                <button id="previousSong" type="button">⏮</button>
                <button id="playMusic" type="button">▶</button>
                <button id="nextSong" type="button">⏭</button>
            </div>
            <label for ="musicVolume">volume</label>
            <input type="range" id="musicVolume" min="0"
            max="100" value="40">


        </div>
            <h2>Tools</h2>
            <label for="colorPicker">Brush Color:</label>
            <input type="color" id="colorPicker" value="#000000">
           <label for="brushSize"> Brush size:</label> 
           <input type="range" id="brushSize" min="1" max="50" value="5">
            <span id="brushSizeValue"></span>
            <div class="shapes">
                <h2>Shapes</h2>
                <button id="shapePickerButton" type="button">Shapes ▾</button>
                <div id="shapePickerPanel" class="shape-picker hidden">
                    <div class="shape-grid">
                    <button id="brushButton" class="shape-option" type="button" title="Brush">
                        <span class="shape-icon">✏️</span>
                        <span class="shape-name">brush</span>
                    </button>
                    <button id="rectangleButton" class="shape-option" type="button" title="Rectangle">
                <span class="shape-icon">▭</span>
                <span class="shape-name">Rectangle</span>
            </button>

            <button id="circleButton" class="shape-option" type="button" title="Circle">
                <span class="shape-icon">◯</span>
                <span class="shape-name">Circle</span>
            </button>

            <button id="lineButton" class="shape-option" type="button" title="Line">
                <span class="shape-icon">／</span>
                <span class="shape-name">Line</span>
            </button>

            <button id="triangleButton" class="shape-option" type="button" title="Triangle">
                <span class="shape-icon">△</span>
                <span class="shape-name">Triangle</span>
            </button>

            <button id="ovalButton" class="shape-option" type="button" title="Oval">
                <span class="shape-icon">⬭</span>
                <span class="shape-name">Oval</span>
            </button>

            <button id="arrowButton" class="shape-option" type="button" title="Arrow">
                <span class="shape-icon">➜</span>
                <span class="shape-name">Arrow</span>
            </button>

            <button id="starButton" class="shape-option" type="button" title="Star">
                <span class="shape-icon">★</span>
                <span class="shape-name">Star</span>
            </button>

            <button id="heartButton" class="shape-option" type="button" title="Heart">
                <span class="shape-icon">♥</span>
                <span class="shape-name">Heart</span>
            </button>

            <button id="hexagonButton" class="shape-option" type="button" title="Hexagon">
                <span class="shape-icon">⬡</span>
                <span class="shape-name">Hexagon</span>
            </button>
                </div>
            </div>
            <label class="shape-fill" for="fillShape">
                <input type="checkbox" id="fillShape">🪣
            </label>
                
            </div> 
            <div class="tracing-tools">
                <input type="file" id="traceUpload" accept ="image/">

            </div>
            <button id="saveButton">+</button>

        </section>
        <section class="drawing-area">
            <h2>Drawing Area</h2>
            <div class="canvas-stack">
            <canvas id="drawingCanvas" width="800" height="500"></canvas>
            <img id="traceGuide" alt="Tracing reference" hidden>
        </div>
         <div class = "container">
            <button id ="undo">UNDO</button>
            <button id ="eraserButton">Eraser</button>
            <button id="clearButton">Clear</button>
            <button id="previous">Previous</button>
           
            </div>
        </section>
       
    </main>

    <footer>
        <p>&copy; 2023 My Drawing App. All rights reserved.</p>
    </footer>

    <script type="module" src="./dist/main.js"></script>
</body>
</html>
