
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing App</title>
    <link rel="stylesheet" href="draw.css">

</head>
<body>
    <header>
        <h1>My Drawing App</h1>
        <p>Draw something creative!</p>
    </header>

    <main>
        <section>
            <h2>Drawing Tools</h2>
            <label for="colorPicker">Brush Color:</label>
            <input type="color" id="colorPicker" value="#000000">
            <button id="clearButton">Clear Drawing</button>
        
        </section>

        <section>
            <h2>Drawing Area</h2>
            <canvas id="drawingCanvas" width="800" height="500"></canvas>
        </section>
    </main>

    <footer>
        <p>Created with HTML and TypeScript</p>
    </footer>

    <script type="module" src="./dist/main.js"></script>
</body>
</html>
