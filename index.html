
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Drawing App</title>
    <link rel="stylesheet" href="draw.css">

</head>
<body>
    <header>
        <h1>Create</h1>
        <p>Draw something!</p>
    </header>

    <main class="layout">
        <section class="tools">
            <h2>Tools</h2>

            <label for="colorPicker">Brush Color:</label>
            <input type="color" id="colorPicker" value="#000000">
           <label for="brushSize"> Brush size:</label> 
           <input type="range" id="brushSize" min="1" max="50" value="5">
            <span id="brushSizeValue"></span>
            <div class="shapes">
                    <h2>Shapes</h2>
                    <button id="brushButton">Brush</button>
                    <button id="rectangleButton">Rectangle</button>
                    <button id="circleButton">Circle</button>
                    <button id="lineButton">Line</button>
                    <button id="triangleButton">Triangle</button>
                    <label for="fillShape">
                        <input type="checkbox" id="fillShape">🪣
                    </label>
                 </div>
            <button id ="undo">UNDO</button>
            <button id ="eraserButton">Eraser</button>
            <button id="clearButton">Clear</button>
            <button id="previous">Previous</button>
            <button id="saveButton">+</button>
            
           
            

        </section>
        

        <section class="drawing-area">
            <h2>Drawing Area</h2>
            <canvas id="drawingCanvas" width="800" height="500"></canvas>
            
    </section>
    </main>

    <footer>
        <p>&copy; 2023 My Drawing App. All rights reserved.</p>
    </footer>

    <script type="module" src="./dist/main.js"></script>
</body>
</html>
